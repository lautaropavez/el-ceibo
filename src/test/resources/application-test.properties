# Perfil "test": se activa explicitamente via @ActiveProfiles("test")
# en las clases de test (NO existe application.properties en
# src/test/resources para no ocultar el application.properties
# principal del classpath de main).
#
# El nombre de la base es fijo (libreriaweb_testsuite) y NO es
# configurable desde aca ni desde ninguna variable externa: queda
# escrito literal en la URL. Solo host/puerto/usuario/password son
# configurables via TEST_DB_HOST / TEST_DB_PORT / TEST_DB_USERNAME /
# TEST_DB_PASSWORD, con defaults locales no secretos.
#
# TestDatabaseInitializer vuelve a fijar estas mismas claves con
# maxima precedencia (PropertySource.addFirst) antes del refresh del
# contexto, para que ninguna variable de entorno externa (por ejemplo
# SPRING_DATASOURCE_URL) pueda redirigir el DataSource de test.
spring.datasource.url=jdbc:mysql://${TEST_DB_HOST:localhost}:${TEST_DB_PORT:3306}/libreriaweb_testsuite?allowPublicKeyRetrieval=true&useSSL=false&useTimezone=true&serverTimezone=GMT&characterEncoding=UTF-8
spring.datasource.username=${TEST_DB_USERNAME:root}
spring.datasource.password=${TEST_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
