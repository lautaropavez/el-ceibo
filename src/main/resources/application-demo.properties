# Perfil "demo" (SPRING_PROFILES_ACTIVE=local,demo). El nombre de la base
# (libreriaweb_demo) queda escrito literal y NO es configurable. Las
# credenciales de usuarios demo no tienen default: si falta la variable,
# el arranque falla (fail-closed).
spring.datasource.url=jdbc:mysql://${DEMO_DB_HOST:localhost}:${DEMO_DB_PORT:3306}/libreriaweb_demo?allowPublicKeyRetrieval=true&useSSL=false&useTimezone=true&serverTimezone=GMT&characterEncoding=UTF-8
spring.datasource.username=${DEMO_DB_USERNAME:root}
spring.datasource.password=${DEMO_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
app.demo.admin.mail=${DEMO_ADMIN_MAIL}
app.demo.admin.password=${DEMO_ADMIN_PASSWORD}
app.demo.usuario.mail=${DEMO_USUARIO_MAIL}
app.demo.usuario.password=${DEMO_USUARIO_PASSWORD}
