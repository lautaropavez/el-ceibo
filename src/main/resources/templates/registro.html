<!DOCTYPE html>
<html lang="es-AR" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="author" content="Lautaro Pavez">
        <title>Libreria El Ceibo - Registro</title>
        <!-- Icono página-->
        <link rel="icon" type="image/x-icon" href="/img/favicon.ico">
        <!-- Font Awesome icons (free version)-->
        <script src="https://use.fontawesome.com/releases/v6.1.0/js/all.js" crossorigin="anonymous"></script>
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="/css/login-style.css" type="text/css" rel="stylesheet" />
        <!-- Tema visual -->
        <link href="/css/ceibo-theme.css" type="text/css" rel="stylesheet" />
    </head>
    <body id="page-top">
        <!-- Navigation-->
        <nav th:replace="/fragments/nav :: nav"></nav>
        <main id="contenido">
            <header class="ceibo-page-header">
                <div class="ceibo-container">
                    <h1>Registro</h1>
                </div>
            </header>
            <section class="ceibo-auth">
                <div class="ceibo-container">
                    <div class="row gx-5 gy-4 align-items-center justify-content-center">
                        <div class="col-lg-5 order-lg-1">
                            <div class="ceibo-form-card">
                                <div th:replace="/fragments/message :: div"></div>
                                <form th:action="@{/registrar}" method="POST" id="form">  <!-- Cuando yo haga click en registrarme, va a ejecutar una action que es una URL, entonces action le ponemos el nombre de la action que se va a ejecutar en el servidor-->
                                    <div class="mb-3">
                                        <label for="name">Nombre</label>
                                        <input type="text" name="nombre" id="name" class="form-control" autocomplete="given-name" th:value="${nombre}" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="apellido">Apellido</label>
                                        <input type="text" name="apellido" id="apellido" class="form-control" autocomplete="family-name" th:value="${apellido}" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="mail">Email</label>
                                        <input type="email" name="mail" id="mail" class="form-control" autocomplete="email" th:value="${mail}" required>
                                    </div>
                                    <p th:if="${error != null}" class="ceibo-hint">Por seguridad, ingresá nuevamente las contraseñas.</p>
                                    <div class="mb-3">
                                        <label for="clave1">Contraseña</label>
                                        <input type="password" name="clave1" id="clave1" class="form-control" autocomplete="new-password" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="clave2">Repetir contraseña</label>
                                        <input type="password" name="clave2" id="clave2" class="form-control" autocomplete="new-password" required>
                                    </div>
                                    <div class="ceibo-form-actions">
                                        <button type="submit" class="btn btn-primary">Guardar</button>
                                        <a th:href="@{/}" class="btn btn-outline-secondary">Volver</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                        <div class="col-lg-5 order-lg-2 d-none d-lg-block">
                            <img class="img-fluid rounded ceibo-img" src="/img/librosmano.jpg" alt="" />
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <!-- Footer -->
        <footer th:replace="/fragments/footer :: footer"></footer>
        <!-- Bootstrap core JS-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
