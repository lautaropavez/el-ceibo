<div class="ceibo-messages">
    <div th:if="${exito}!=null" class="ceibo-msg ceibo-msg--success" role="status">
        <div>
            <strong>Éxito</strong>
            <p th:text="${exito}"></p>
        </div>
    </div>
    <div th:if="${error}!= null" class="ceibo-msg ceibo-msg--error" role="alert">
        <div>
            <strong>Error</strong>
            <p th:text="${error}"></p>
        </div>
    </div>
</div>
