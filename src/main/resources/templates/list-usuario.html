<!DOCTYPE html>
<html lang="es-AR" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="fragments/head :: head (pageTitle='Libreria El Ceibo - Lista de Usuarios')"></head>
    <body id="body">
        <header>
            <nav th:replace="fragments/nav :: nav"></nav>
        </header>
        <div th:replace="fragments/sidebar :: div"></div>
        <main id="contenido">
            <div th:replace="fragments/message :: div"></div>

            <div class="card">
              <div class="card-header">
                <h1>Lista de Usuarios Registrados</h1>
              </div>
                <div class="card-body">
                    <div class="ceibo-search">
                        <div class="d-flex flex-wrap gap-2">
                          <!-- se pueden ocultar botones segun el rol con sec:authorize="hasRole('ADMIN')" -->
                          <a th:href="@{/registro}" class="btn btn-primary">NUEVO USUARIO</a>
                          <button type="button" class="btn btn-outline-secondary" disabled><i class="far fa-file-alt" aria-hidden="true"></i> PDF · Próximamente</button>
                        </div>
                    </div>
                    <div class="ceibo-table-wrap table-responsive">
                    <table class="table table-striped align-middle">
                        <thead>
                            <tr>
                                <th>Id</th>
                                <th>Nombre</th>
                                <th>Apellido</th>
                                <th>Mail</th>
                                <!-- con sec:authorize="hasRole('ADMIN')" podria ocultar columnas segun el rol -->
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                        <!-- Si quiero que solo se muestren segun el tributo alta debo agregar la linea  th:if="${p.alta} == TRUE" -->
                        <!-- Usamos un auxiliar que se llama usuario que va a recorrer una lista que se llama usuarios(entre el ${} le pasamos la variable)-->
                            <tr  th:each="usuario : ${usuarios}">
                                <td th:text="${usuario.id}"></td>
                                <td th:text="${usuario.nombre}"></td>
                                <td th:text="${usuario.apellido}"></td>
                                <td th:text="${usuario.mail}"></td>
                                <!--  == true ? 'Activo' : 'Baja' (NO ME SIRVIÓ DE ESTA MANERA)  Con esa instruccion consulto si el campo alta es true cambia 
                                  por Activo sino cambia por Baja -->
                                <!-- <td sec:authorize="hasRole('ADMIN')" th:text="${p.alta} == true ? 'Activo' : 'Baja' "></td> -->
                                <td>
                                  <span th:if="${usuario.baja} == null" class="ceibo-status ceibo-status--ok">Activo</span>
                                  <span th:if="${usuario.baja} != null" class="ceibo-status ceibo-status--off">Baja</span>
                                </td>
                                <td class="text-nowrap">
                                  <a class="ceibo-icon-link" title="Modificar" aria-label="Modificar" th:href="@{/usuario/modificar/__${usuario.id}__}"><i class="fas fa-edit" aria-hidden="true"></i></a>
                                  <form th:if="${usuario.baja} == null" class="d-inline" method="post" th:action="@{/usuario/baja/{id}(id=${usuario.id})}"><button type="submit" class="btn btn-link ceibo-icon-btn ceibo-icon-btn--danger p-0 border-0" title="Dar de baja" aria-label="Dar de baja"><i class="fas fa-arrow-circle-down" aria-hidden="true"></i></button></form>
                                  <form th:if="${usuario.baja} != null" class="d-inline" method="post" th:action="@{/usuario/alta/{id}(id=${usuario.id})}"><button type="submit" class="btn btn-link ceibo-icon-btn ceibo-icon-btn--success p-0 border-0" title="Dar de alta" aria-label="Dar de alta"><i class="fas fa-arrow-circle-up" aria-hidden="true"></i></button></form>
                                  <form class="d-inline" method="post" th:action="@{/usuario/eliminar/{id}(id=${usuario.id})}"><button type="submit" class="btn btn-link ceibo-icon-btn ceibo-icon-btn--danger p-0 border-0" title="Eliminar" aria-label="Eliminar"><i class="fas fa-trash-alt" aria-hidden="true"></i></button></form>
                                </td>                            
                            </tr>
                        </tbody>
</table>
                    </div>
                    <p class="mt-3 mb-0" th:if="${usuarios.isEmpty}">No hay usuarios para mostrar</p>
                </div>
            </div>
        </main>
        <!-- Footer-->
        <footer th:replace="fragments/footer :: footer"></footer>
        <!-- Bootstrap js -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <!-- Sidebar js -->
        <script src="/js/sidebar.js"></script>   
    </body>
</html>
