<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="Lautaro Pavez"> 
        <title>Biblioteca</title>
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" th:href="@{/img/ceibo.svg}" />
        <!-- Bootstrap icons-->
        <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css}" rel="stylesheet" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link th:href="@{/css/biblioteca.css}" rel="stylesheet" />
    </head>
    <body>
        <!-- Navigation-->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark p-3">
            <div class="container px-4 px-lg-5">
                <a class="navbar-brand" href="/">
                    <img src="/img/ceibo.svg" alt="Logo El Ceibo" width="30" height="24" class="d-inline-block align-text-top">
                    EL CEIBO
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                        <li class="nav-item"><a class="nav-link active" aria-current="page" href="#!">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="#!">About</a></li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" id="navbarDropdown" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Shop</a>
                            <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                                <li><a class="dropdown-item" href="#!">All Products</a></li>
                                <li><hr class="dropdown-divider" /></li>
                                <li><a class="dropdown-item" href="#!">Popular Items</a></li>
                                <li><a class="dropdown-item" href="#!">New Arrivals</a></li>
                            </ul>
                        </li>
                    </ul>
                    <form class="d-flex">
                        <button class="btn btn-outline-dark" type="submit">
                            <i class="bi-cart-fill me-1"></i>
                            Cart
                            <span class="badge bg-dark text-white ms-1 rounded-pill">0</span>
                        </button>
                    </form>
                    <ul class="navbar-nav ms-3">
                        <li class="nav-item" sec:authorize="isAnonymous()">
                            <a href="/registro" class="nav-link">Registrate</a>
                        </li>
                        <li class="nav-item" sec:authorize="isAnonymous()">
                            <a href="/login" class="nav-link">Log In</a>
                        </li>
                        <li class="nav-item" sec:authorize="isAuthenticated()">
                            <span class="nav-link" sec:authentication="name"></span>
                        </li>
                        <li class="nav-item" sec:authorize="isAuthenticated()">
                            <a href="/logout" class="nav-link">Cerrar sesión</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <!-- Header-->
        <header class="bg-dark py-5">
            <div class="container px-4 px-lg-5 my-5">
                <div class="text-center text-white">
                    <h1 class="display-4 fw-bolder">Biblioteca El Ceibo</h1>
                    <p class="lead fw-normal text-white-50 mb-0">Explorá nuestro catálogo de libros</p>
                </div>
            </div>
        </header>
        <!-- Section-->
        <section class="py-5">
            <div class="container px-4 px-lg-5 mt-5">
                <form class="row g-3 mb-4" method="get" th:action="@{/libro/biblioteca}">
                    <div class="col-auto">
                        <input type="text" class="form-control" name="buscar" th:value="${buscar}" placeholder="Buscar por título, autor o editorial...">
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-outline-dark">Buscar</button>
                    </div>
                </form>
                <p th:if="${#lists.isEmpty(libros)}" class="text-center">No hay libros para mostrar.</p>
                <div class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center">
                    <div class="col mb-5" th:each="libro : ${libros}">
                        <div class="card h-100">
                            <img th:if="${libro.portada != null}" class="card-img-top" th:src="@{/portada/libro/{id}(id=${libro.id})}" alt="Portada"/>
                            <img th:if="${libro.portada == null}" class="card-img-top" th:src="@{/img/libro.jpg}" alt="Sin portada"/>
                            <div class="card-body p-4">
                                <div class="text-center">
                                    <h5 class="fw-bolder" th:text="${libro.titulo}"></h5>
                                    <p class="mb-1" th:text="${libro.autor == null ? 'Autor sin registro' : libro.autor.nombre}"></p>
                                    <p class="mb-1" th:text="${libro.editorial == null ? 'Editorial sin registro' : libro.editorial.nombre}"></p>
                                    <p class="mb-1" th:text="${libro.anio}"></p>
                                    <span th:if="${libro.ejemplaresRestantes > 0}" class="badge bg-success" th:text="|Disponible (${libro.ejemplaresRestantes})|"></span>
                                    <span th:if="${libro.ejemplaresRestantes <= 0}" class="badge bg-danger">Sin disponibilidad</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <!-- Footer-->
        <footer class="py-5 bg-dark">
            <div class="container"><p class="m-0 text-center text-white">Copyright &copy; El Ceibo 2026</p></div>
        </footer>
        <!-- Bootstrap core JS-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Core theme JS-->
    </body>
</html>
