<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="Lautaro Pavez">
        <title>Biblioteca</title>
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" th:href="@{/img/favicon.ico}" />
        <!-- Bootstrap icons-->
        <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css}" rel="stylesheet" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link th:href="@{/css/biblioteca.css}" rel="stylesheet" />
        <!-- Tema visual -->
        <link th:href="@{/css/ceibo-theme.css}" rel="stylesheet" />
    </head>
    <body>
        <!-- Navigation-->
        <nav th:replace="fragments/nav :: nav"></nav>
        <main id="contenido">
            <!-- Header-->
            <header class="ceibo-page-header">
                <div class="ceibo-container">
                    <h1>Biblioteca El Ceibo</h1>
                    <p>Explorá nuestro catálogo de libros</p>
                </div>
            </header>
            <!-- Section-->
            <section class="ceibo-section">
                <div class="ceibo-container">
                    <div th:replace="fragments/message :: div"></div>
                    <form class="ceibo-search" method="get" th:action="@{/libro/biblioteca}" role="search">
                        <input type="text" class="form-control" name="buscar" th:value="${buscar}" placeholder="Buscar por título, autor o editorial..." aria-label="Buscar por título, autor o editorial">
                        <button type="submit" class="btn btn-outline-dark">Buscar</button>
                    </form>
                    <p th:if="${#lists.isEmpty(libros)}" class="text-center">No hay libros para mostrar.</p>
                    <div class="row g-3 g-lg-4 row-cols-2 row-cols-md-3 row-cols-xl-4">
                        <div class="col" th:each="libro : ${libros}">
                            <div class="card ceibo-book-card h-100">
                                <img th:if="${libro.portada != null}" class="card-img-top ceibo-cover" th:src="@{/portada/libro/{id}(id=${libro.id})}" alt="Portada"/>
                                <img th:if="${libro.portada == null}" class="card-img-top ceibo-cover" th:src="@{/img/libro.jpg}" alt="Sin portada"/>
                                <div class="card-body p-3">
                                    <h2 th:text="${libro.titulo}"></h2>
                                    <p th:text="${libro.autor == null ? 'Autor sin registro' : libro.autor.nombre}"></p>
                                    <p th:text="${libro.editorial == null ? 'Editorial sin registro' : libro.editorial.nombre}"></p>
                                    <p th:text="${libro.anio}"></p>
                                    <div class="ceibo-book-card__actions">
                                        <span th:if="${libro.ejemplaresRestantes > 0}" class="badge bg-success" th:text="|Disponible (${libro.ejemplaresRestantes})|"></span>
                                        <span th:if="${libro.ejemplaresRestantes <= 0}" class="badge bg-danger">Sin disponibilidad</span>
                                        <form th:if="${libro.ejemplaresRestantes > 0}" sec:authorize="hasRole('USUARIO')"
                                              method="post" th:action="@{/prestamo/solicitar}" class="mt-2">
                                            <input type="hidden" name="libroId" th:value="${libro.id}"/>
                                            <button type="submit" class="btn btn-sm btn-dark w-100">Solicitar</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <!-- Footer-->
        <footer th:replace="fragments/footer :: footer"></footer>
        <!-- Bootstrap core JS-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Core theme JS-->
    </body>
</html>
