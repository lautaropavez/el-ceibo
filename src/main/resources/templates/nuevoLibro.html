<!DOCTYPE html>
<html lang="es-AR" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="/fragments/head :: head (pageTitle='Libreria El Ceibo - Registro Libro')"></head>
    <body id="body">
        <header>
            <nav th:replace="/fragments/nav :: nav"></nav>
        </header>
        <div th:replace="/fragments/sidebar :: div"></div>
        <main id="contenido">
            <div class="ceibo-narrow">
                <h1 class="mb-3">Registro Libro</h1>
                <div th:replace="/fragments/message :: div"></div>
                <form th:action="@{/libro/registrar}" method="POST" enctype="multipart/form-data" class="ceibo-form-card">
                    <div class="mb-3">
                        <label for="archivo">Portada</label>
                        <input type="file" id="archivo" name="archivo" accept="image/jpeg,image/png" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label for="titulo">Título</label>
                        <input th:value="${titulo}" type="text" id="titulo" name="titulo" class="form-control" placeholder="Título del libro">
                    </div>
                    <div class="mb-3">
                        <label for="anio">Año</label>
                        <input th:value="${anio}" type="number" id="anio" name="anio" class="form-control" placeholder="Año del libro">
                    </div>
                    <div class="mb-3">
                        <label for="nroEjemplares">Cantidad de ejemplares</label>
                        <input type="number"
                               id="nroEjemplares"
                               name="nroEjemplares"
                               th:value="${nroEjemplares}"
                               min="1"
                               max="999"
                               required
                               class="form-control"
                               placeholder="Cantidad de ejemplares">
                    </div>
                    <div class="mb-3">
                        <label for="idAutor">Autores</label>
                        <div class="input-group">
                            <select class="form-select" id="idAutor" name="idAutor">
                                <option th:each="autor : ${autores}" th:value="${autor.id}" th:text="${autor.nombre}" name="autor"></option>
                            </select>
                            <!-- Botón nuevo Autor-->
                            <a th:href="@{/autor/registroAutor}" class="btn btn-outline-secondary">Agregar</a>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="idEditorial">Editoriales</label>
                        <div class="input-group">
                            <select class="form-select" id="idEditorial" name="idEditorial">
                                <option th:each="editorial : ${editoriales}" th:value="${editorial.id}" th:text="${editorial.nombre}" name="editorial"></option>
                            </select>
                            <!-- Botón nueva Editorial-->
                            <a th:href="@{/editorial/registroEditorial}" class="btn btn-outline-secondary">Agregar</a>
                        </div>
                    </div>
                    <div class="ceibo-form-actions">
                        <button type="submit" class="btn btn-primary">Guardar</button>
                        <a th:href="@{/}" class="btn btn-outline-secondary">Volver</a>
                    </div>
                </form>
            </div>
        </main>
        <!-- Footer-->
        <footer th:replace="/fragments/footer :: footer"></footer>
        <!-- Bootstrap js -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <!-- Sidebar js -->
        <script src="/js/sidebar.js"></script>
    </body>
</html>
