<!DOCTYPE html>
<html lang="es-AR" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="/fragments/head :: head (pageTitle='Libreria El Ceibo - Lista de Libros')"></head>
    <body id="body">
        <header>
            <nav th:replace="/fragments/nav :: nav"></nav>
        </header>
        <div th:replace="/fragments/sidebar :: div"></div>
       <main id="contenido">
            <div th:replace="/fragments/message :: div"></div>

            <div class="card">
                <div class="card-header">
                  <h1>Lista de Editoriales Registradas</h1>
                </div>
                <div class="card-body">
                    <div class="ceibo-search">
                        <div class="d-flex flex-wrap gap-2">
                          <!-- se pueden ocultar botones segun el rol con sec:authorize="hasRole('ADMIN')" -->
                          <a th:href="@{/editorial/registroEditorial}" class="btn btn-primary">NUEVA EDITORIAL</a>
                          <button type="button" class="btn btn-outline-secondary" disabled><i class="far fa-file-alt" aria-hidden="true"></i> PDF · Próximamente</button>
                        </div>
                    </div>
                    <div class="ceibo-table-wrap table-responsive">
                    <table class="table table-striped align-middle">
                        <thead>
                            <tr>
                                <th>Id</th>
                                <th>Nombre</th>
                                <!-- con sec:authorize="hasRole('ADMIN')" podria ocultar columnas segun el rol -->
                                <th>Estado</th>
                                <th>Administración</th>
                            </tr>
                        </thead>
                        <tbody>
                          <!-- Si quiero que solo se muestren segun el tributo alta debo agregar la linea  th:if="${p.alta} == TRUE" -->
                            <tr  th:each="editorial : ${editoriales}">
                                <td th:text="${editorial.id}"></td>
                                <td th:text="${editorial.nombre}"></td>
                                <!-- Forma con PathVariable-->
                                <td>
                                  <span th:if="${editorial.alta}" class="ceibo-status ceibo-status--ok">Activo</span>
                                  <span th:unless="${editorial.alta}" class="ceibo-status ceibo-status--off">Baja</span>
                                </td>
                                <td>
                                  <form th:if="${editorial.alta} == true" class="d-inline" method="post" th:action="@{/editorial/baja/{id}(id=${editorial.id})}"><button type="submit" class="btn btn-link ceibo-icon-btn ceibo-icon-btn--danger p-0 border-0" title="Dar de baja" aria-label="Dar de baja"><i class="fas fa-arrow-circle-down" aria-hidden="true"></i></button></form>
                                  <form th:if="${editorial.alta} == false" class="d-inline" method="post" th:action="@{/editorial/alta/{id}(id=${editorial.id})}"><button type="submit" class="btn btn-link ceibo-icon-btn ceibo-icon-btn--success p-0 border-0" title="Dar de alta" aria-label="Dar de alta"><i class="fas fa-arrow-circle-up" aria-hidden="true"></i></button></form>
                                  <form class="d-inline" method="post" th:action="@{/editorial/eliminar/{id}(id=${editorial.id})}"><button type="submit" class="btn btn-link ceibo-icon-btn ceibo-icon-btn--danger p-0 border-0" title="Eliminar" aria-label="Eliminar"><i class="fas fa-trash-alt" aria-hidden="true"></i></button></form>
                                </td>
                            </tr>
                        </tbody>
</table>
                    </div>
                    <p class="mt-3 mb-0" th:if="${editoriales.isEmpty}">No hay editoriales para mostrar</p>
                </div>
            </div>
        </main>
        <!-- Footer-->
        <footer th:replace="/fragments/footer :: footer"></footer>
        <!-- Bootstrap js -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <!-- Sidebar js -->
        <script src="/js/sidebar.js"></script>
    </body>
</html>
