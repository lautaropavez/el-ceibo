<!DOCTYPE html>
<html lang="es-AR" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <meta name="author" content="Lautaro Pavez">
        <title>Libreria El Ceibo - Login</title>
        <!-- Icono página -->
        <link rel="icon" type="image/x-icon" href="/img/favicon.ico">
        <!-- Font Awesome icons (free version)-->
        <script src="https://use.fontawesome.com/releases/v6.1.0/js/all.js" crossorigin="anonymous"></script>
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="/css/login-style.css" rel="stylesheet" />
        <!-- Tema visual -->
        <link href="/css/ceibo-theme.css" rel="stylesheet" />
    </head>
    <body id="page-top">
        <!-- Navigation-->
        <nav th:replace="fragments/nav :: nav"></nav>
        <main id="contenido">
            <header class="ceibo-page-header">
                <div class="ceibo-container">
                    <h1>¡Ingresa, tus libros te están esperando!</h1>
                </div>
            </header>
            <section class="ceibo-auth">
                <div class="ceibo-container">
                    <div class="row gx-5 gy-4 align-items-center justify-content-center">
                        <div class="col-lg-5 order-lg-1">
                            <div class="ceibo-form-card">
                                <div th:replace="fragments/message :: div"></div>
                                <form th:action="@{/logincheck}" method="POST" id="form">
                                    <div class="mb-3">
                                        <label for="username">Email</label>
                                        <input type="email" id="username" name="username" class="form-control" autocomplete="username" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="password">Contraseña</label>
                                        <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required>
                                    </div>
                                    <div class="ceibo-form-actions">
                                        <button type="submit" class="btn btn-primary">Ingresar</button>
                                        <a href="/registro" class="btn btn-outline-secondary">Registrate</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                        <div class="col-lg-5 order-lg-2 d-none d-lg-block">
                            <img class="img-fluid rounded ceibo-img" src="/img/librosmano.jpg" alt="" />
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <!-- Footer -->
        <footer th:replace="fragments/footer :: footer"></footer>
        <!-- Bootstrap core JS-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
