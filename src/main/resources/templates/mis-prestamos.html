<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="Lautaro Pavez">
        <title>Mis préstamos</title>
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" th:href="@{/img/favicon.ico}" />
        <!-- Bootstrap icons-->
        <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css}" rel="stylesheet" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link th:href="@{/css/biblioteca.css}" rel="stylesheet" />
        <!-- Tema visual -->
        <link th:href="@{/css/ceibo-theme.css}" rel="stylesheet" />
    </head>
    <body>
        <!-- Navigation-->
        <nav th:replace="fragments/nav :: nav"></nav>
        <main id="contenido">
            <!-- Header-->
            <header class="ceibo-page-header">
                <div class="ceibo-container">
                    <h1>Mis préstamos</h1>
                    <p>Historial de préstamos activos y devueltos</p>
                </div>
            </header>
            <!-- Section-->
            <section class="ceibo-section">
                <div class="ceibo-container">
                    <div th:replace="fragments/message :: div"></div>
                    <p th:if="${#lists.isEmpty(prestamos)}" class="text-center">Todavía no solicitaste ningún préstamo.</p>
                    <div th:if="${!#lists.isEmpty(prestamos)}" class="ceibo-table-wrap">
                        <table class="table table-striped ceibo-stack-table">
                            <thead>
                                <tr>
                                    <th scope="col">Libro</th>
                                    <th scope="col">Fecha de préstamo</th>
                                    <th scope="col">Fecha de vencimiento</th>
                                    <th scope="col">Estado</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="prestamo : ${prestamos}">
                                    <td data-label="Libro" th:text="${prestamo.libro.titulo}"></td>
                                    <td data-label="Fecha de préstamo" th:text="${#dates.format(prestamo.fechaPrestamo, 'dd-MM-yyyy')}"></td>
                                    <td data-label="Fecha de vencimiento" th:text="${#dates.format(prestamo.fechaVencimiento, 'dd-MM-yyyy')}"></td>
                                    <td data-label="Estado">
                                        <span th:if="${prestamo.fechaDevolucion == null}" class="badge bg-success">Activo</span>
                                        <span th:if="${prestamo.fechaDevolucion != null}" class="badge bg-secondary"
                                              th:text="|Devuelto (${#dates.format(prestamo.fechaDevolucion, 'dd-MM-yyyy')})|"></span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
        <!-- Footer-->
        <footer th:replace="fragments/footer :: footer"></footer>
        <!-- Bootstrap core JS-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
