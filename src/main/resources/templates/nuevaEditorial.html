<!DOCTYPE html>
<html lang="es-AR" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="fragments/head :: head (pageTitle='Libreria El Ceibo - Registro Libro')"></head>
    <body id="body">
        <header>
            <nav th:replace="fragments/nav :: nav"></nav>
        </header>
        <div th:replace="fragments/sidebar :: div"></div>
        <main id="contenido">
            <div class="ceibo-narrow">
                <h1 class="mb-3">Registro Editorial</h1>
                <div th:replace="fragments/message :: div"></div>
                <form th:action="@{/editorial/registrarEditorial}" method="POST" class="ceibo-form-card">
                    <h2 class="h5 mb-3">Nueva Editorial</h2>
                    <div class="mb-3">
                        <label for="nombre">Nombre</label>
                        <input th:value="${nombre}" type="text" id="nombre" name="nombre" class="form-control" placeholder="Nombre de la editorial">
                    </div>
                    <div class="ceibo-form-actions">
                        <button type="submit" class="btn btn-primary">Guardar</button>
                        <a th:href="@{/libro/registro}" class="btn btn-outline-secondary">Volver</a>
                    </div>
                </form>
            </div>
        </main>
        <!-- Footer-->
        <footer th:replace="fragments/footer :: footer"></footer>
        <!-- Bootstrap js -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <!-- Sidebar js -->
        <script src="/js/sidebar.js"></script>
    </body>
</html>
