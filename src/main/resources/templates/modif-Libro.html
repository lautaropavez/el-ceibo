<!DOCTYPE html>
<html lang="es-AR" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="/fragments/head :: head (pageTitle='Libreria El Ceibo - Modificación de Libro')"></head>
    <body id="body">
        <header>
            <nav th:replace="/fragments/nav :: nav"></nav>
        </header>
        <div th:replace="/fragments/sidebar :: div"></div>
        <main id="contenido">
            <div class="ceibo-narrow">
                <h1 class="mb-3">Modificación Libro</h1>
                <div th:replace="/fragments/message :: div"></div>
                <form th:action="@{/libro/modificar/{id}(id=${id})}" method="POST" id="form" enctype="multipart/form-data" class="ceibo-form-card">
                    <input type="hidden" th:value= "${id}" name= "id">
                    <div class="mb-3">
                        <label for="titulo">Título</label>
                        <input th:value="${titulo}" type="text" id="titulo" name="titulo" class="form-control" placeholder="Título del libro">
                    </div>
                    <div class="mb-3">
                        <label for="anio">Año</label>
                        <input th:value="${anio}" type="number" id="anio" name="anio" class="form-control" placeholder="Año del libro">
                    </div>
                    <div class="mb-3">
                        <label for="archivo">Archivo</label>
                        <input type="file" id="archivo" name="archivo" accept="image/jpeg,image/png" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label for="nombreAut">Autor</label>
                        <input th:value="${nombreAut}" type="text" id="nombreAut" name="nombreAut" class="form-control" placeholder="Nombre del autor">
                    </div>
                    <div class="mb-3">
                        <label for="nombreEdit">Editorial</label>
                        <input th:value="${nombreEdit}" type="text" id="nombreEdit" name="nombreEdit" class="form-control" placeholder="Nombre de la editorial">
                    </div>
                    <div class="ceibo-form-actions">
                        <button type="submit" class="btn btn-primary">Guardar</button>
                        <a th:href="@{/libro/lista}" class="btn btn-outline-secondary">Volver</a>
                    </div>
                    <p class="warnings" id="warnings" aria-live="polite"></p>
                </form>
            </div>
        </main>
        <!-- Footer-->
        <footer th:replace="/fragments/footer :: footer"></footer>
        <!-- Bootstrap js -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <!-- Sidebar js -->
        <script src="/js/sidebar.js"></script>
    </body>
</html>
