<!DOCTYPE html>
<html lang="es-AR" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="fragments/head :: head (pageTitle='Libreria El Ceibo - Modificación de Usuario')"></head>
    <body id="body">
        <header>
            <nav th:replace="fragments/nav :: nav"></nav>
        </header>
        <div th:replace="fragments/sidebar :: div"></div>
        <main id="contenido">
            <div class="ceibo-narrow">
                <h1 class="mb-3">Modificación Usuario</h1>
                <div th:replace="fragments/message :: div"></div>
                <form th:action="@{/usuario/modificar/{id}(id=${id})}" method="POST" id="form" class="ceibo-form-card">
                    <input type="hidden" th:value= "${id}" name= "id">
                    <div class="mb-3">
                        <label for="nombre">Nombre</label>
                        <input th:value="${nombre}" type="text" id="nombre" name="nombre" class="form-control" placeholder="Nombre">
                    </div>
                    <div class="mb-3">
                        <label for="apellido">Apellido</label>
                        <input th:value="${apellido}" type="text" id="apellido" name="apellido" class="form-control" placeholder="Apellido">
                    </div>
                    <div class="mb-3">
                        <label for="mail">Email</label>
                        <input th:value="${mail}" type="email" id="mail" name="mail" class="form-control" placeholder="Email" required>
                    </div>
                    <div class="mb-3">
                        <label for="clave">Nueva clave (dejar en blanco para no cambiarla)</label>
                        <input type="password" id="clave" name="clave" class="form-control" placeholder="Nueva clave (opcional)" autocomplete="new-password">
                    </div>
                    <div class="mb-3">
                        <label for="clave2">Repetir clave</label>
                        <input type="password" id="clave2" name="clave2" class="form-control" placeholder="Repetir nueva clave" autocomplete="new-password">
                    </div>
                    <div class="ceibo-form-actions">
                        <button type="submit" class="btn btn-primary">Guardar</button>
                        <a th:href="@{/usuario/lista}" class="btn btn-outline-secondary">Volver</a>
                    </div>
                    <p class="warnings" id="warnings" aria-live="polite"></p>
                </form>
            </div>
        </main>
        <!-- Footer-->
        <footer th:replace="fragments/footer :: footer"></footer>
        <!-- Bootstrap js -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <!-- Sidebar js -->
        <script src="/js/sidebar.js"></script>
    </body>
</html>
