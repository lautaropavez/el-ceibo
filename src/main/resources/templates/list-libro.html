<!DOCTYPE html>
<html lang="es-AR" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="fragments/head :: head (pageTitle='Libreria El Ceibo - Lista de Libros')"></head>
    <body id="body">
        <header>
            <nav th:replace="fragments/nav :: nav"></nav>
        </header>
        <div th:replace="fragments/sidebar :: div"></div>
       <main id="contenido">
            <div th:replace="fragments/message :: div"></div>

            <div class="card">
                <div class="card-header">
                  <h1>Lista de Libros Registrados</h1>
                </div>
                <div class="card-body">
                    <div class="ceibo-search">
                        <div class="d-flex flex-wrap gap-2">
                          <!-- se pueden ocultar botones segun el rol con sec:authorize="hasRole('ADMIN')" -->
                          <a th:href="@{/libro/registro}" class="btn btn-primary">NUEVO LIBRO</a>
                          <button type="button" class="btn btn-outline-secondary" disabled><i class="far fa-file-alt" aria-hidden="true"></i> PDF · Próximamente</button>
                        </div>
                    </div>
                    <div class="ceibo-table-wrap table-responsive">
                    <table class="table table-striped align-middle">
                        <thead>
                            <tr>
                                <th>Id</th>
                                <th>Título</th>
                                <th>Portada</th>
                                <th>Autor</th>
                                <th>Editorial</th>
                                <th>Ejemplares</th>
                                <th>Prestados</th>
                                <th>Disponibles</th>
                                <th>ISBN</th>
                                <th>Año</th>
                                <!-- con sec:authorize="hasRole('ADMIN')" podria ocultar columnas segun el rol -->
                                <th>Estado</th>
                                <th>Administración</th>
                            </tr>
                        </thead>
                        <tbody>
                          <!-- Si quiero que solo se muestren segun el tributo alta debo agregar la linea  th:if="${p.alta} == TRUE" -->
                            <tr  th:each="libro : ${libros}">
                                <td th:text="${libro.id}"></td>
                                <td th:text="${libro.titulo}"></td>
                                <!-- Forma con RequestParam-->
                                <!-- <td> <img th:if="${libro.portada} != null" alt="Portada" class="bd-placeholder-img card-img-top" th:src="${'/portada/libro?id=' + libro.id}" style="width: auto; height: 60px;"> </td> -->
                                <!-- Forma con PathVariable-->
                                <td> <img th:if="${libro.portada} != null" alt="Portada" class="bd-placeholder-img card-img-top" th:src="${'/portada/libro/' + libro.id}" style="width: auto; height: 70px;"> </td>
                                <td th:text="${libro.autor} == null ? 'sin registro' : ${libro.autor.nombre}"></td>
                                <td th:text="${libro.editorial} == null ? 'sin registro' : ${libro.editorial.nombre}"></td> 
                                <td th:text="${libro.nroejemplares}"></td>
                                <td th:text="${libro.ejemplaresPrestados}"></td>
                                <td th:text="${libro.ejemplaresRestantes}"></td>
                                <td th:text="${libro.isbn}"></td> 
                                <td th:text="${libro.anio}"></td>
                                <td>
                                  <span th:if="${libro.alta}" class="ceibo-status ceibo-status--ok">Activo</span>
                                  <span th:unless="${libro.alta}" class="ceibo-status ceibo-status--off">Baja</span>
                                </td>
                                <td class="text-nowrap">
                                  <a class="ceibo-icon-link" title="Modificar" aria-label="Modificar" th:href="@{/libro/modificar/__${libro.id}__}"><i class="fas fa-edit" aria-hidden="true"></i></a>
                                  <form th:if="${libro.alta} == true" class="d-inline" method="post" th:action="@{/libro/baja/{id}(id=${libro.id})}"><button type="submit" class="btn btn-link ceibo-icon-btn ceibo-icon-btn--danger p-0 border-0" title="Dar de baja" aria-label="Dar de baja"><i class="fas fa-arrow-circle-down" aria-hidden="true"></i></button></form>
                                  <form th:if="${libro.alta} == false" class="d-inline" method="post" th:action="@{/libro/alta/{id}(id=${libro.id})}"><button type="submit" class="btn btn-link ceibo-icon-btn ceibo-icon-btn--success p-0 border-0" title="Dar de alta" aria-label="Dar de alta"><i class="fas fa-arrow-circle-up" aria-hidden="true"></i></button></form>
                                  <form class="d-inline" method="post" th:action="@{/libro/eliminar/{id}(id=${libro.id})}"><button type="submit" class="btn btn-link ceibo-icon-btn ceibo-icon-btn--danger p-0 border-0" title="Eliminar" aria-label="Eliminar"><i class="fas fa-trash-alt" aria-hidden="true"></i></button></form>
                                </td>
                            </tr>
                        </tbody>
</table>
                    </div>
                    <p class="mt-3 mb-0" th:if="${libros.isEmpty}">No hay libros para mostrar</p>
                </div>
            </div>
        </main>
        <!-- Footer-->
        <footer th:replace="fragments/footer :: footer"></footer>
        <!-- Bootstrap js -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <!-- Sidebar js -->
        <script src="/js/sidebar.js"></script>
    </body>
</html>
