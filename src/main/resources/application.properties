#Configuracion MYSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#Configuracion JPA(HIBERNATE)
# No se registran las sentencias SQL en la configuracion distribuida; para diagnostico
# local activarlo en application-local.properties (ver application.properties.example).
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.open-in-view=false
#Configuracion THYMELEAF
# Cache de plantillas activa en la configuracion distribuida (DevTools la desactiva
# solo al ejecutar desde el IDE).
spring.thymeleaf.cache=true
#Configuracion MULTIPART (upload de portadas)
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB
